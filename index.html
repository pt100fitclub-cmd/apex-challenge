s e tornozelos — começa com cargas leves até dominares a técnica.",videoId:"o68EE5iRfpc"},{id:5,name:"Crab Abs",sub:"Toques Mão-Pé",color:"red",hasLoad:false,noScore:false,icon:"💪",duracao:5,tecnica:"Senta-te no chão com os joelhos fletidos e as mãos apoiadas atrás de ti. Eleva as ancas do chão, equilibrando-te em mãos e pés. Levanta uma perna e toca o pé com a mão oposta, mantendo as ancas elevadas durante o movimento. Alterna as pernas em ritmo controlado, mantendo o core contraído e a coluna neutra.",videoId:"Wq71CEFggg8"}],aquecimento:3,// minutos de aquecimento

1. RESPONSÁVEL PELO TRATAMENTO
O responsável pelo tratamento dos seus dados pessoais é o 100%FitClub, doravante designado por "Clube".

2. DADOS RECOLHIDOS
O Clube recolhe as seguintes categorias de dados pessoais:
• Dados de identificação: nome completo, alcunha, número de atleta.
• Dados de contacto: número de telemóvel, endereço de e-mail e, opcionalmente, redes sociais.
• Dados de imagem: fotografia de perfil (opcional, mediante consentimento expresso) e imagens/vídeos captados durante as sessões e eventos do Clube.

3. FINALIDADE DO TRATAMENTO

(a) Identificação e autenticação do atleta na plataforma APEX Challenge;
(b) Registo, acompanhamento e divulgação de resultados desportivos individuais e por equipa;
(c) Publicação de rankings e classificações na plataforma, incluindo nome/alcunha e fotografia de perfil quando autorizada;
(d) Comunicações do Clube sobre atividades, sessões, resultados e eventos — incluindo por e-mail, SMS, WhatsApp e redes sociais;

4. COMUNICAÇÕES

• Resultados e rankings das sessões em que participou;

• Novidades, desafios e iniciativas do 100%FitClub.

5. CAPTAÇÃO DE IMAGEM DURANTE AS AULAS

6. BASE LEGAL
O tratamento tem como base legal o consentimento expresso do titular, nos termos do artigo 6.º, n.º 1, alínea a) do RGPD (Regulamento UE 2016/679). A fotografia de perfil e as comunicações estão sujeitas a consentimento específico.

7. CONSERVAÇÃO DOS DADOS

8. DIREITOS DO TITULAR

1. FORMATO DA AULA
O APEX Challenge é uma aula de 45 minutos de alta intensidade (HIIT/Endurance) dividida em fases fixas:
• 00–10 min — Aquecimento Específico (mobilidade articular, ativação muscular)
• 10–15 min — Briefing & Setup (explicação dos movimentos e registo na App)
• 15–20 min — Estação 1: Walking Lunge com Carga
• 20–25 min — Estação 2: Burpee 10 metros
• 25–35 min — Estação 3: Bike Endurance (todos em simultâneo)
• 35–40 min — Estação 4: Squat Overhead (OHS) com Disco
• 40–45 min — Estação 5: Crab Abs
• 45–50 min — Retorno à Calma e identificação do Atleta da Aula

O tempo total de esforço (Bloco APEX) é de 30 minutos, excluindo aquecimento e cool-down.

2. AS 5 ESTAÇÕES

ESTAÇÃO 1 — WALKING LUNGE COM CARGA
Passada frontal com carga (halteres, kettlebell ou disco) ao longo de uma distância.
Regras técnicas:
• O joelho da frente deve formar um ângulo de 90°
• O joelho de trás deve aproximar-se do solo sem bater com força
• O tronco mantém-se perpendicular ao solo
Score: Repetições × Carga (kg) = pontos

ESTAÇÃO 2 — BURPEE 10 METROS
Burpee executado com salto em comprimento.
Regras técnicas:
• O peito deve tocar no chão
• O salto deve ser explosivo para a frente
• O atleta deve completar os 10 metros antes de virar
Score: Número de repetições completas = pontos

ESTAÇÃO 3 — BIKE ENDURANCE
10 minutos de esforço cardiovascular contínuo nas bicicletas do estúdio de cycling.
Regras técnicas:
• Manter cadência constante durante os 10 minutos
• Evitar bouncing (bater com a bacia no selim)
• Manter a coluna alinhada
Nota: Esta estação não tem score competitivo. Registo opcional de FC e RPE.

ESTAÇÃO 4 — SQUAT OVERHEAD (OHS) COM DISCO
Agachamento profundo mantendo o disco bloqueado acima da cabeça com braços esticados.
Regras técnicas:
• O disco deve estar alinhado com a parte de trás da cabeça
• Os calcanhares devem manter-se sempre no solo
• Se o atleta sentir que vai perder o equilíbrio, deve baixar o peso
• Quanto mais fundo o agachamento, maior o trabalho de mobilidade
Score: Repetições × Carga (kg) = pontos

ESTAÇÃO 5 — CRAB ABS
Posição de caranguejo (mãos e pés no chão, barriga para cima) com toques alternados mão-pé.
Regras técnicas:
• Manter a bacia elevada durante todo o exercício
• O movimento deve ser controlado e coordenado: mão direita toca pé esquerdo, mão esquerda toca pé direito
Score: Número de toques mão-pé completos = pontos

3. CÁLCULO DO SCORE TOTAL
Score Total = Estação 1 + Estação 2 + Estação 4 + Estação 5
A Estação 3 (Bike) não conta para o score total.

Exemplos:
• E1: 20 lunges × 10 kg = 200 pts
• E2: 12 burpees = 12 pts
• E4: 15 OHS × 10 kg = 150 pts
• E5: 40 toques = 40 pts
• TOTAL: 402 pts

4. REGISTO DE RESULTADOS
• O registo de dados é obrigatório após cada estação
• Cada atleta regista os seus próprios resultados na App através do QR Code
• Em caso de falha tecnológica, o instrutor utiliza prancheta de papel
• O atleta pode navegar livremente entre estações — não é obrigatória a ordem sequencial
• Os dados são guardados estação a estação e podem ser corrigidos antes de confirmar

5. ATLETA DA AULA
No final de cada sessão, o instrutor identifica publicamente o Atleta da Aula — o participante com o score total mais elevado nessa sessão.

6. RANKINGS
• Ranking Total: melhor score individual de cada atleta em todas as sessões
• Ranking por Clubes: soma de todos os scores de todas as aulas do clube
• Ranking por Grupos: soma dos scores de todos os atletas de cada horário/grupo

7. FAIR PLAY E SEGURANÇA
• A gestão de ritmo é fundamental — não te esgotes na primeira estação
• A segurança técnica é prioritária sobre a carga ou velocidade
• O instrutor tem autoridade para corrigir ou interromper qualquer exercício por razões de segurança
• Qualquer resultado registado de forma incorreta pode ser anulado pelo instrutor

8. PONTUALIDADE E PRESENÇA
A pontualidade é obrigatória e faz parte do espírito APEX Challenge.
• Os atletas devem estar prontos para começar à hora marcada
• Atrasos injustificados ao início da aula são passíveis de penalização
• Saídas antecipadas sem aviso prévio ao instrutor são igualmente penalizadas
• A penalização por incumprimento horário é de -50 pontos por ocorrência

9. ARRUMAÇÃO DE MATERIAL
Cada atleta é responsável pela arrumação do material que utilizou durante a aula.
• No final da sessão, todo o material (halteres, discos, kettlebells) deve ser devolvido ao local de origem
• A não arrumação do material é considerada incumprimento de regras e é penalizada
• A penalização por não arrumação de material é de -50 pontos por ocorrência
• O instrutor verifica a arrumação antes de encerrar a sessão

10. PENALIZAÇÕES
O instrutor tem autoridade para aplicar penalizações antes do encerramento de cada aula.
Tipos de penalização:
• Incumprimento Horário (-50 pts): atraso injustificado ao início ou saída antecipada sem aviso
• Incumprimento de Regras (-50 pts): não arrumação de material ou outro comportamento contrário ao regulamento
As penalizações são acumuláveis — um atleta pode receber penalização por atraso e por material na mesma aula (-100 pts total).
O processo de penalização é realizado pelo instrutor durante o encerramento da sessão, antes de terminar a aula.
